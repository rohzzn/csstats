<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>CS Stats</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="spx-popup">
      <header class="spx-topbar">
        <img class="spx-topbar-icon" src="icon48.png" width="24" height="24" alt="" decoding="async" />
        <h1 class="spx-topbar-title">CS Stats</h1>
        <span class="spx-topbar-version" id="appVersion" hidden></span>
      </header>

      <div class="spx-popup-body">
        <section class="spx-showcase" aria-labelledby="showcaseTitle">
          <h2 class="spx-showcase-header" id="showcaseTitle">Stats Showcase</h2>

          <div class="spx-showcase-content">
            <div class="spx-setting">
              <div class="spx-setting-text">
                <span class="spx-setting-label" id="premierLabel">Premier rating</span>
                <span class="spx-setting-description" id="premierDescription">Shown in the Stats showcase</span>
              </div>

              <div class="spx-segmented" role="radiogroup" aria-labelledby="premierLabel" aria-describedby="premierDescription">
                <label class="spx-segment">
                  <input type="radio" name="premierMode" value="current" />
                  <span>Current</span>
                </label>
                <label class="spx-segment">
                  <input type="radio" name="premierMode" value="peak" checked />
                  <span>Peak</span>
                </label>
              </div>
            </div>

            <div class="spx-setting">
              <div class="spx-setting-text">
                <span class="spx-setting-label" id="faceitLabel">FACEIT ELO</span>
                <span class="spx-setting-description" id="faceitDescription">Shown beside the FACEIT level</span>
              </div>

              <div class="spx-segmented" role="radiogroup" aria-labelledby="faceitLabel" aria-describedby="faceitDescription">
                <label class="spx-segment">
                  <input type="radio" name="faceitMode" value="current" />
                  <span>Current</span>
                </label>
                <label class="spx-segment">
                  <input type="radio" name="faceitMode" value="peak" checked />
                  <span>Peak</span>
                </label>
              </div>
            </div>

            <p class="spx-save-error" id="saveError" role="alert" hidden></p>

            <p class="spx-hint">
              <span class="spx-hint-key">Tip:</span> click the Premier badge or FACEIT ELO on any profile to switch.
            </p>
          </div>
        </section>

        <footer class="spx-footer">
          <nav class="spx-footer-links" aria-label="Data sources">
            <a href="https://leetify.com/" target="_blank" rel="noopener noreferrer">Leetify</a>
            <span class="spx-footer-dot" aria-hidden="true">&middot;</span>
            <a href="https://www.faceit.com/" target="_blank" rel="noopener noreferrer">FACEIT</a>
            <span class="spx-footer-dot" aria-hidden="true">&middot;</span>
            <a href="https://allstar.gg/" target="_blank" rel="noopener noreferrer">Allstar</a>
          </nav>
          <span class="spx-save-state" id="saveState" role="status" aria-live="polite"></span>
        </footer>
      </div>
    </main>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
